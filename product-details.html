<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details | S K Groups</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <img src="images/logo.svg" alt="S K Groups Logo" style="height: 60px;">
      </a>
      
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="shop.html" class="active">Shop</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
      </nav>
      
      <!-- Mobile Menu Button -->
      <button class="mobile-menu-btn" aria-label="Toggle navigation" style="display: none; background: none; border: none; font-size: 1.5rem; color: var(--primary-color); cursor: pointer;">
        <i class="fa-solid fa-bars"></i>
      </button>
    </div>
  </header>

  <!-- Details Content -->
  <section class="section-padding">
    <div class="container">
      <a href="shop.html" class="details-back-link">
        <i class="fa-solid fa-arrow-left"></i> Back to Shop
      </a>
      
      <div id="product-container" class="details-wrapper" style="display: none;">
        <div class="details-grid">
          <!-- Left Column: Image -->
          <div class="details-image-container">
            <img id="product-img" src="" alt="" class="details-img">
          </div>
          
          <!-- Right Column: Primary Info -->
          <div class="details-info">
            <div id="product-cat" class="details-meta-cat"></div>
            <h1 id="product-title" class="details-title"></h1>
            <div id="product-short-desc" class="details-short-desc"></div>
            <p id="product-long-desc" class="details-long-desc"></p>
            
            <div class="details-actions">
              <a id="product-whatsapp" href="" target="_blank" class="btn btn-whatsapp">
                <i class="fa-brands fa-whatsapp"></i> Enquire on WhatsApp
              </a>
            </div>
          </div>
        </div>
        
        <!-- Specifications & Key Features -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 40px; margin-top: 40px; border-top: 2px solid var(--primary-bg); padding-top: 40px;">
          <div>
            <h3 class="details-section-title">Specifications</h3>
            <table class="specs-table">
              <tbody id="product-specs">
                <!-- Dynamically populated -->
              </tbody>
            </table>
          </div>
          <div>
            <h3 class="details-section-title">Key Features</h3>
            <ul id="product-features" class="features-list">
              <!-- Dynamically populated -->
            </ul>
          </div>
        </div>
      </div>
      
      <!-- Error Message -->
      <div id="error-container" class="details-wrapper" style="display: none; text-align: center; padding: 60px 20px;">
        <i class="fa-solid fa-triangle-exclamation" style="font-size: 4rem; color: var(--accent-color); margin-bottom: 20px;"></i>
        <h2 style="margin-bottom: 15px;">Product Not Found</h2>
        <p style="color: #666; margin-bottom: 30px;">The product you are looking for does not exist or may have been removed.</p>
        <a href="shop.html" class="btn btn-primary">Return to Shop</a>
      </div>
    </div>
  </section>

  <!-- Floating WhatsApp Button -->
  <a href="https://wa.me/919964923811" target="_blank" class="fab" aria-label="Chat on WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <!-- Footer -->
  <footer>
    <div class="container">
      <div class="footer-bottom" style="border-top: none; padding-top: 0;">
        &copy; 2026 S K Groups. All rights reserved.
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
  <script src="products.js?v=1.0.2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Get URL parameters
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');
      
      const productContainer = document.getElementById('product-container');
      const errorContainer = document.getElementById('error-container');
      
      // Check if product exists in our data
      if (productId && productsData[productId]) {
        const product = productsData[productId];
        
        // Update browser tab title
        document.title = `${product.name} | S K Groups`;
        
        // Populate page content
        document.getElementById('product-img').src = product.image;
        document.getElementById('product-img').alt = product.name;
        document.getElementById('product-cat').textContent = product.category;
        document.getElementById('product-title').textContent = product.name;
        document.getElementById('product-short-desc').textContent = product.shortDescription;
        document.getElementById('product-long-desc').textContent = product.longDescription;
        
        // Prefilled WhatsApp Enquiry link
        const whatsappNumber = "919964923811";
        const customMessage = encodeURIComponent(product.whatsappText ? product.whatsappText : `I'm interested in ${product.name}`);
        document.getElementById('product-whatsapp').href = `https://wa.me/${whatsappNumber}?text=${customMessage}`;
        
        // Populate specifications table
        const specsTbody = document.getElementById('product-specs');
        specsTbody.innerHTML = '';
        
        if (product.specifications && Object.keys(product.specifications).length > 0) {
          for (const [key, value] of Object.entries(product.specifications)) {
            const tr = document.createElement('tr');
            
            const labelTd = document.createElement('td');
            labelTd.className = 'spec-label';
            labelTd.textContent = key;
            
            const valueTd = document.createElement('td');
            valueTd.className = 'spec-value';
            valueTd.textContent = value;
            
            tr.appendChild(labelTd);
            tr.appendChild(valueTd);
            specsTbody.appendChild(tr);
          }
        } else {
          // Fallback if no specs
          specsTbody.innerHTML = '<tr><td colspan="2" class="spec-value">Contact us for detailed technical specifications.</td></tr>';
        }
        
        // Populate key features list
        const featuresUl = document.getElementById('product-features');
        featuresUl.innerHTML = '';
        
        if (product.keyFeatures && product.keyFeatures.length > 0) {
          product.keyFeatures.forEach(feature => {
            const li = document.createElement('li');
            li.innerHTML = `<i class="fa-solid fa-check-circle"></i> <span>${feature}</span>`;
            featuresUl.appendChild(li);
          });
        } else {
          // Fallback if no features
          featuresUl.innerHTML = `<li><i class="fa-solid fa-check-circle"></i> <span>High-quality poultry solution direct from S K Groups.</span></li>`;
        }
        
        // Display the product panel
        productContainer.style.display = 'block';
      } else {
        // Show error message
        errorContainer.style.display = 'block';
      }
    });
  </script>
</body>
</html>
